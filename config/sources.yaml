  # L'Usine Digitale bloque les robots (HTTP 403) au 17/11/2026. Réactivez si cela change.
  - id: usine_digitale
    name: "L'Usine Digitale"
    type: rss
    url: "https://www.usine-digitale.fr/rss"
    lang: fr
    weight: 1.0
    enabled: false

  # --- Agrégateur communautaire ---
  - id: hackernews
    name: "Hacker News"
    type: hackernews
    lang: en
    weight: 0.8
    min_points: 150
    queries:
      - "AI"
      - "LLM"
      - "OpenAI"
      - "Anthropic"
      - "Gemini"
      - "machine learning"
      - "data"
