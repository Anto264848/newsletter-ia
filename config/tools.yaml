# Liste des "outils à tester". Un outil différent chaque semaine, dans l'ordre, sans répétition
# (l'historique est dans data/history.json). Les liens viennent d'ici : l'IA ne les invente jamais.
# Ajoutez-en quand vous voulez : il suffit d'un nom, d'une URL et d'une courte description factuelle
# (la description sert de base à l'IA pour sa présentation vulgarisée).
#
# Quand la liste est épuisée, l'IA propose elle-même un outil (présenté sans lien) et un
# avertissement apparaît dans les logs GitHub Actions pour vous inviter à compléter cette liste.

tools:
  - name: "NotebookLM"
    url: "https://notebooklm.google.com/"
    facts: "Outil gratuit de Google : on y dépose ses documents (PDF, notes, liens) et on peut poser des questions dessus, obtenir des résumés ou même un podcast audio généré automatiquement."
  - name: "Le Chat de Mistral AI"
    url: "https://chat.mistral.ai/"
    facts: "Assistant conversationnel de l'entreprise française Mistral AI, utilisable gratuitement dans le navigateur ou sur mobile."
  - name: "Perplexity"
    url: "https://www.perplexity.ai/"
    facts: "Moteur de recherche conversationnel : il répond aux questions en citant ses sources sous forme de liens. Version gratuite disponible."
  - name: "Google Lens"
    url: "https://lens.google/"
    facts: "Application gratuite qui reconnaît ce que l'appareil photo voit : traduire un panneau, identifier une plante, retrouver un objet en ligne."
  - name: "DeepL Traducteur"
    url: "https://www.deepl.com/translator"
    facts: "Traducteur automatique basé sur l'IA, réputé pour la qualité de ses traductions. Version gratuite avec limite de caractères."
  - name: "Merlin Bird ID"
    url: "https://merlin.allaboutbirds.org/"
    facts: "Application gratuite du Cornell Lab of Ornithology qui identifie les oiseaux à partir d'une photo ou de leur chant enregistré."
  - name: "Canva (fonctions Magic)"
    url: "https://www.canva.com/"
    facts: "Outil de création graphique en ligne avec des fonctions d'IA (génération d'images, suppression d'arrière-plan, etc.). Offre gratuite disponible, certaines fonctions IA limitées."
  - name: "Remove.bg"
    url: "https://www.remove.bg/"
    facts: "Site qui supprime automatiquement l'arrière-plan d'une photo en quelques secondes. Gratuit en basse résolution."
  - name: "Whisper via Hugging Face"
    url: "https://huggingface.co/spaces/openai/whisper"
    facts: "Démonstration en ligne gratuite du modèle de transcription audio Whisper : on envoie un enregistrement, on récupère le texte."
  - name: "Microsoft Copilot"
    url: "https://copilot.microsoft.com/"
    facts: "Assistant IA gratuit de Microsoft, accessible dans le navigateur, sur mobile et dans Windows."
  - name: "Google Gemini"
    url: "https://gemini.google.com/"
    facts: "Assistant IA gratuit de Google, accessible dans le navigateur et sur mobile, relié aux services Google si on le souhaite."
  - name: "ChatGPT"
    url: "https://chatgpt.com/"
    facts: "L'assistant conversationnel d'OpenAI, utilisable gratuitement avec un compte (version gratuite avec limites d'usage)."
  - name: "Claude"
    url: "https://claude.ai/"
    facts: "Assistant IA d'Anthropic, version gratuite disponible sur le web et sur mobile, apprécié pour la rédaction et l'analyse de documents."
  - name: "Seeing AI"
    url: "https://www.seeingai.com/"
    facts: "Application gratuite de Microsoft conçue pour les personnes aveugles ou malvoyantes : elle décrit à voix haute les scènes, lit les textes et reconnaît les billets."
  - name: "Be My Eyes"
    url: "https://www.bemyeyes.com/"
    facts: "Application gratuite qui aide les personnes malvoyantes grâce à des bénévoles et à un assistant IA capable de décrire des photos."
  - name: "Google Arts & Culture"
    url: "https://artsandculture.google.com/"
    facts: "Plateforme gratuite de Google pour explorer des œuvres d'art et des musées, avec des expériences ludiques utilisant l'IA."
  - name: "Quick, Draw!"
    url: "https://quickdraw.withgoogle.com/"
    facts: "Jeu gratuit de Google : vous dessinez, et une IA essaie de deviner ce que c'est en moins de 20 secondes. Montre de façon ludique comment une IA apprend."
  - name: "Teachable Machine"
    url: "https://teachablemachine.withgoogle.com/"
    facts: "Outil gratuit de Google pour entraîner soi-même un petit modèle d'IA (reconnaître des images, des sons ou des poses) sans écrire de code."
  - name: "Suno"
    url: "https://suno.com/"
    facts: "Service qui génère des chansons (musique et voix) à partir d'une description texte. Crédits gratuits quotidiens."
  - name: "Ideogram"
    url: "https://ideogram.ai/"
    facts: "Générateur d'images à partir de texte, réputé pour bien écrire du texte lisible dans les images. Offre gratuite limitée."
  - name: "Microsoft Designer"
    url: "https://designer.microsoft.com/"
    facts: "Outil gratuit de Microsoft pour créer des visuels (invitations, publications) à partir d'une description en texte."
  - name: "Otter.ai"
    url: "https://otter.ai/"
    facts: "Service de prise de notes automatique qui transcrit réunions et conversations en anglais. Offre gratuite limitée en minutes."
  - name: "Goblin Tools"
    url: "https://goblin.tools/"
    facts: "Petits outils gratuits pensés notamment pour les personnes neuroatypiques : découper une tâche en étapes, reformuler un message selon le ton voulu, estimer une durée."
  - name: "Photomath"
    url: "https://photomath.com/"
    facts: "Application qui résout des exercices de maths pris en photo et explique les étapes de la solution. Version gratuite disponible."
  - name: "Duolingo"
    url: "https://www.duolingo.com/"
    facts: "Application d'apprentissage des langues gratuite qui utilise l'IA pour adapter les exercices au niveau de chacun."
  - name: "Khanmigo (Khan Academy)"
    url: "https://www.khanmigo.ai/"
    facts: "Tuteur IA de la Khan Academy qui guide l'élève vers la réponse plutôt que de la donner. Gratuit pour les enseignants dans de nombreux pays."
  - name: "Gamma"
    url: "https://gamma.app/"
    facts: "Outil qui génère des présentations ou des pages web à partir d'un simple texte. Crédits gratuits à l'inscription."
  - name: "Napkin"
    url: "https://www.napkin.ai/"
    facts: "Outil qui transforme un texte en schémas et illustrations visuelles. Offre gratuite disponible."
  - name: "Clipdrop"
    url: "https://clipdrop.co/"
    facts: "Boîte à outils de retouche photo par IA (agrandir une image, effacer un objet, changer l'éclairage). Usage gratuit limité."
  - name: "Adobe Podcast Enhance"
    url: "https://podcast.adobe.com/enhance"
    facts: "Outil web gratuit d'Adobe qui nettoie un enregistrement audio : réduit le bruit de fond et rend la voix plus claire."
  - name: "Hugging Face Spaces"
    url: "https://huggingface.co/spaces"
    facts: "Vitrine gratuite de milliers de démonstrations d'IA (génération d'images, de voix, de texte) utilisables directement dans le navigateur."
  - name: "Poe"
    url: "https://poe.com/"
    facts: "Plateforme qui donne accès à plusieurs assistants IA de différentes entreprises au même endroit. Usage gratuit limité par jour."
  - name: "Consensus"
    url: "https://consensus.app/"
    facts: "Moteur de recherche qui répond aux questions en s'appuyant sur des articles scientifiques publiés. Version gratuite disponible."
  - name: "Elicit"
    url: "https://elicit.com/"
    facts: "Assistant de recherche qui trouve et résume des articles scientifiques. Version gratuite disponible."
  - name: "Have I Been Trained?"
    url: "https://haveibeentrained.com/"
    facts: "Site qui permet de chercher si une image (par exemple une œuvre) figure dans les grandes bases de données utilisées pour entraîner des IA génératrices d'images."
  - name: "Google Translate (mode conversation)"
    url: "https://translate.google.com/"
    facts: "L'application Google Traduction propose un mode conversation qui traduit à l'oral, en direct, entre deux personnes. Gratuit."
  - name: "Pl@ntNet"
    url: "https://plantnet.org/"
    facts: "Application gratuite issue de la recherche publique française qui identifie les plantes à partir d'une photo, avec l'aide d'une communauté de botanistes."
  - name: "Mozilla Common Voice"
    url: "https://commonvoice.mozilla.org/"
    facts: "Projet participatif gratuit de Mozilla : chacun peut enregistrer sa voix pour aider à créer des IA de reconnaissance vocale ouvertes, y compris en français."
  - name: "Elements of AI"
    url: "https://www.elementsofai.com/"
    facts: "Cours en ligne gratuit (disponible en français) de l'Université d'Helsinki pour comprendre les bases de l'IA, sans maths compliquées."
  - name: "Ollama"
    url: "https://ollama.com/"
    facts: "Logiciel gratuit pour faire tourner des modèles d'IA directement sur son ordinateur, sans envoyer ses données sur internet (demande un ordinateur assez puissant)."
