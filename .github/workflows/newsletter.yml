name: Newsletter hebdomadaire

on:
  schedule:
    # Chaque lundi à 06:00 UTC (07:00 heure de Paris en hiver, 08:00 en été).
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run : générer le numéro SANS l'envoyer (aperçu téléchargeable dans les artifacts)"
        type: boolean
        default: true
      force:
        description: "Forcer l'envoi même si le numéro de cette semaine est déjà parti (déconseillé)"
        type: boolean
        default: false

permissions:
  contents: write

# Jamais deux exécutions en parallèle (protection supplémentaire contre le double envoi).
concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Vérifier le code (tests)
        run: python -m pytest -q

      - name: Générer (et envoyer) le numéro
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FALLBACK_API_KEY: ${{ secrets.FALLBACK_API_KEY }}
          FALLBACK_BASE_URL: ${{ vars.FALLBACK_BASE_URL }}
          FALLBACK_MODEL: ${{ vars.FALLBACK_MODEL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="--dry-run"; fi
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          echo "Lancement : python main.py $args"
          python main.py $args

      - name: Joindre l'aperçu du numéro (artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: apercu-numero-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 30

      # On enregistre data/ (historique, verrous) et docs/ (site) même si une étape a échoué
      # APRÈS l'envoi : le verrou anti double envoi doit toujours être sauvegardé.
      - name: Enregistrer l'historique, les verrous et le site
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
            exit 0
          fi
          git commit -m "Numéro de la semaine $(date -u +%G-W%V) [automatique]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push refusé, nouvel essai dans 10 s..."; sleep 10
          done
          echo "::error::Impossible de pousser les changements"; exit 1
