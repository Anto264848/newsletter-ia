name: Reconstruire le site

# Régénère docs/ quand vous modifiez la configuration ou les gabarits du site
# (ex. : ajout de l'URL du formulaire d'inscription, changement de nom), sans envoyer d'email.
on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "newsletter/templates/site/**"
      - "newsletter/site/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt

      - name: Générer le site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python main.py --site-only

      - name: Enregistrer docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "Site inchangé."; exit 0; fi
          git commit -m "Site reconstruit [automatique]"
          git pull --rebase --autostash && git push
